name: User Story
description: User-facing increment of value with acceptance criteria
title: "[Story] "
labels: ["story", "priority: medium"]
body:
  - type: markdown
    attributes:
      value: |
        Stories describe value from the user's perspective. Include testable acceptance criteria.

        **Labels:** `story` + priority. **Native Type:** set to **Feature** after creation (`gh issue edit N --type Feature` or GraphQL).
  - type: textarea
    id: user_story
    attributes:
      label: User story
      description: As a / I want / so that
      value: |
        **As a** ...
        **I want** ...
        **so that** ...
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Given / When / Then scenarios or a checklist
      placeholder: |
        ### Scenario: Happy path
        - **Given** ...
        - **When** ...
        - **Then** ...
    validations:
      required: true
  - type: textarea
    id: technical_notes
    attributes:
      label: Technical notes
      description: Affected modules, APIs, links to code
    validations:
      required: false
  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of Done
      value: |
        - [ ] Acceptance criteria met
        - [ ] Tests added or updated where applicable
        - [ ] Documentation updated if user-facing
    validations:
      required: true
  - type: input
    id: parent_epic
    attributes:
      label: Parent epic (optional)
      description: Epic issue number, e.g. 42 for #42
      placeholder: "42"
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - priority: high
        - priority: medium
        - priority: low
    validations:
      required: true
